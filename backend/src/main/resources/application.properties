# ===================================================================
# Real-Time Weather Intelligence Platform - Main Application Properties
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=weather-intel-backend

# -------------------------------------------------------------------
# Datasource Configuration
# Defaults to in-memory H2 database with MySQL compatibility mode
# (Zero setup required; runs out-of-the-box in IntelliJ / CLI)
# To use MySQL: provide DB_URL, DB_USERNAME, DB_PASSWORD environment
# variables or run with --spring.profiles.active=mysql
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:weather_intel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.sql.init.mode=never

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# File Upload Multipart Limits
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# -------------------------------------------------------------------
# Apache Kafka Settings (Optional streaming ingestion)
# -------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.auto-startup=false

# -------------------------------------------------------------------
# Application Specific Settings
# -------------------------------------------------------------------
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8001}
app.kafka.enabled=false
app.kafka.topic=weather.raw.ingestion
app.storage.upload-dir=uploads
