server:
  port: 8080

spring:
  application:
    name: weather-intel-backend

  datasource:
    url: jdbc:mysql://localhost:3306/weather_intel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "9926883877"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
